name: Build StockYuan Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_android_apk.yml'
      - 'docs/icon-192.png'
      - 'docs/icon-512.png'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Minimal Native Android WebView Project & Build Signed APK
        run: |
          mkdir -p android_app/app/src/main/java/com/stockyuan/app
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/res/mipmap-mdpi
          mkdir -p android_app/app/src/main/res/mipmap-hdpi
          mkdir -p android_app/app/src/main/res/mipmap-xhdpi
          mkdir -p android_app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android_app/app/src/main/res/mipmap-xxxhdpi

          cp docs/icon-192.png android_app/app/src/main/res/drawable/ic_launcher.png
          cp docs/icon-192.png android_app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp docs/icon-192.png android_app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp docs/icon-192.png android_app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp docs/icon-512.png android_app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp docs/icon-512.png android_app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat << 'EOF' > android_app/settings.gradle
          rootProject.name = "StockYuan"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.stockyuan.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.stockyuan.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName "4.3.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="StockYuan"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/stockyuan/app/MainActivity.java
          package com.stockyuan.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Color;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#070b14"));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("https://jackson910923.github.io/StockYuan/");
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cd android_app
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../docs/StockYuan.apk

      - name: Commit StockYuan.apk to docs/ for direct QR download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/StockYuan.apk
          git diff --staged --quiet || (git commit -m "chore(apk): publish latest StockYuan.apk with custom app icon" && git push origin HEAD:main)
