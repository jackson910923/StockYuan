name: AlphaTW 台股 AI 多智能體每日盤後結算與選股排程

on:
  schedule:
    # 台灣時間週一至週五 16:35 (UTC 08:35) 自動執行盤後三大法人結算與 AI 多空辯論
    - cron: '35 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上一鍵手動觸發

permissions:
  contents: write

jobs:
  run-daily-alpha-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AlphaTW Multi-Agent Daily Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python run_daily_pipeline.py

      - name: Commit & Push Updated Daily Intelligence to GitHub Pages
        run: |
          git config user.name "AlphaTW-AI-Agent"
          git config user.email "agent@alphatw.local"
          git add data/latest_report.json docs/data/latest_report.json docs/daily_briefing.md
          git diff --staged --quiet || git commit -m "chore(daily): update Taiwan stock AI multi-agent report $(date +'%Y-%m-%d')"
          git push
